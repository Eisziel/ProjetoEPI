{% extends "page_app/global/index.html" %}
{% load static %}

{% block title %}Entrar{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">

      <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white text-center">
          <h5 class="mb-0">
            <i class="fa-solid fa-right-to-bracket me-2 text-warning"></i>
            Entrar no sistema
          </h5>
        </div>

        <div class="card-body p-4">
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                {{ message }}
                <button class="btn-close" data-bs-dismiss="alert"></button>
              </div>
            {% endfor %}
          {% endif %}

          <form method="post">
            {% csrf_token %}

            <div class="mb-3">
              <label class="form-label fw-semibold">Usuário</label>
              <input type="text" name="username" class="form-control" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Senha</label>
              <input type="password" name="senha" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-warning text-dark fw-semibold w-100">
              <i class="fa-solid fa-right-to-bracket me-1"></i> Entrar
            </button>

          </form>
        </div>

      </div>

    </div>
  </div>
</div>
{% endblock %}
